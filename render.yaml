# Modelo para o serviço existente; revisar no painel antes de sincronizar.
services:
  - type: web
    name: entregaprova
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: off
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROOF_STORAGE_PROVIDER
        value: supabase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_HOSTING_SITE
        sync: false
