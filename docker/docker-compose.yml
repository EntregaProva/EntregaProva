services:
  emulators:
    build: ./emulators
    ports:
      - "127.0.0.1:4000:4000"   # UI dos emuladores
      - "127.0.0.1:8080:8080"   # Firestore
      - "127.0.0.1:9099:9099"   # Auth
      - "127.0.0.1:9199:9199"   # Storage
    volumes:
      - ../firebase.json:/workspace/firebase.json:ro
      - ../.firebaserc:/workspace/.firebaserc:ro
      - ../firestore.rules:/workspace/firestore.rules:ro
      - ../storage.rules:/workspace/storage.rules:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9099/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile.dev
    env_file:
      - ../.env
    environment:
      # Dentro do Docker, "localhost" e o proprio container: usar o nome do servico
      FIRESTORE_EMULATOR_HOST: emulators:8080
      FIREBASE_AUTH_EMULATOR_HOST: emulators:9099
      FIREBASE_STORAGE_EMULATOR_HOST: emulators:9199
      CHOKIDAR_USEPOLLING: "true"   # hot reload no Windows
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../backend:/app
      - /app/node_modules
    depends_on:
      emulators:
        condition: service_healthy

  frontend:
    build:
      context: ../entregaprova-app
      dockerfile: ../docker/entregaprova-app/Dockerfile.dev
    env_file:
      - ../.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../entregaprova-app:/app
      - /app/node_modules
    depends_on:
      - backend