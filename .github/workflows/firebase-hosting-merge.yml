name: Render e Hosting
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy-api:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publicar o SHA aprovado no Render e verificar a API
        run: node backend/scripts/deploy-render.mjs
        env:
          VITE_API_URL: https://entregaprova.onrender.com
          VITE_USE_EMULATORS: "false"
          VITE_FIREBASE_PROJECT_ID: entregaprova
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: entregaprova.firebaseapp.com
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENTREGAPROVA }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
