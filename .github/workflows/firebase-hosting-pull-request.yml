name: Hosting preview
on: pull_request
permissions:
  contents: read
concurrency:
  group: hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  preview:
    needs: checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      VITE_API_URL: ${{ vars.API_BASE_URL }}
      VITE_API_PREFIX: /api/v1
      VITE_USE_EMULATORS: "false"
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: entregaprova-app/package-lock.json
      - name: Conferir configuração pública do frontend
        run: node infra/deploy/check-web-config.mjs
      - run: npm ci
        working-directory: entregaprova-app
      - run: npm run build
        working-directory: entregaprova-app
      - name: Verificar a API publicada usada pelo preview
        run: node backend/scripts/smoke.mjs "$VITE_API_URL"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENTREGAPROVA }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
