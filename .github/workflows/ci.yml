name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: ${{ matrix.package }} (lint + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            node: 22
          - package: entregaprova-app
            node: 22
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # DESATIVADO ate os testes do backend passarem (ver Bug Report no relatorio).
  # Para reativar: remova o "# " do inicio de cada linha deste bloco.
  # backend-test:
  #   name: backend (test)
